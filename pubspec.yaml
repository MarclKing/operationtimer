name: meine_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
