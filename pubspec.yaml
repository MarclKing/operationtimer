name: OpTimes
description: "A Work Timer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  flutter_slidable: ^4.0.3
  file_picker: ^10.3.2
  archive: ^4.0.9
  receive_sharing_intent: ^1.8.0
  home_widget: ^0.7.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.1
  camera: ^0.11.0+2
  flutter_native_splash: ^2.4.8  # ← auf 2.4.8 erhöht
  speech_to_text: ^7.0.0 
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  http: ^1.2.0 
  geolocator: ^13.0.0
  flutter_timezone: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#0A0B0F"
  image: assets/logo_trans.png
  web: false
  android_12:
    color: "#0A0B0F"
    image: assets/logo_trans.png
    icon_background_color: "#0A0B0F"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_trans.png
    - assets/logo_trans_rev.png  