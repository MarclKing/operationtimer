<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpTimes">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpTimes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>OpTimes</title>
  <link rel="manifest" href="manifest.json">

  

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0A0B0F;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-wrapper img {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }

    /* Dot trail */
    .dot-trail {
      position: relative;
      width: 37px;
      height: 37px;
      animation: trail-spin 1.4s linear infinite;
    }

    .dot-trail span {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7F77DD;
      left: 50%;
      top: 50%;
      margin-left: -2.5px;
      margin-top: -2.5px;
    }

    .dot-trail span:nth-child(1) { transform: rotate(0deg)   translateY(-14px); opacity: 1.00; }
    .dot-trail span:nth-child(2) { transform: rotate(72deg)  translateY(-14px); opacity: 0.72; }
    .dot-trail span:nth-child(3) { transform: rotate(144deg) translateY(-14px); opacity: 0.45; }
    .dot-trail span:nth-child(4) { transform: rotate(216deg) translateY(-14px); opacity: 0.20; }
    .dot-trail span:nth-child(5) { transform: rotate(288deg) translateY(-14px); opacity: 0.07; }

    @keyframes trail-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0A0B0F;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0A0B0F;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <div id="loading-screen">
    <div class="logo-wrapper">
      <img src="assets/assets/logo_trans.png" alt="OpTimes" onerror="this.src='icons/Icon-192.png'">
    </div>
    <div class="dot-trail">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const screen = document.getElementById('loading-screen');
      if (screen) {
        screen.classList.add('hidden');
        setTimeout(() => screen.remove(), 500);
      }
    });
  </script>
</body></html>
