<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpTimes">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpTimes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OpTimes</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash / Loading Screen Styles -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
    }

    .logo-wrapper img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      object-fit: contain;
    }

    .logo-glow {
      position: absolute;
      inset: -12px;
      border-radius: 34px;
      background: radial-gradient(ellipse at center, rgba(91,141,239,0.35) 0%, transparent 70%);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.95); }
      50%       { opacity: 1.0; transform: scale(1.05); }
    }

    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: #f0f0f5;
      letter-spacing: 0.5px;
    }

    .loading-bar-track {
      width: 120px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5B8DEF, #9B6BF2);
      border-radius: 2px;
      animation: load 1.8s ease-in-out forwards;
    }

    @keyframes load {
      0%   { width: 0%; }
      60%  { width: 75%; }
      90%  { width: 92%; }
      100% { width: 100%; }
    }
  </style>
</head>

<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="assets/assets/logo.png" alt="OpTimes Logo"
           onerror="this.src='icons/Icon-192.png'">
    </div>
    <div class="app-name">OpTimes</div>
    <div class="loading-bar-track">
      <div class="loading-bar-fill"></div>
    </div>
  </div>

  <!-- Flutter Bootstrap (modern only) -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Hide loading screen -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const screen = document.getElementById('loading-screen');
      if (screen) {
        screen.classList.add('hidden');
        setTimeout(() => screen.remove(), 500);
      }
    });
  </script>

</body>
</html>
